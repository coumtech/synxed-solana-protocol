name: Publish SDK

# Publishes sdk/typescript to npm as @coumtech/synxed-solana-protocol, with an
# npm provenance attestation linking the package to this workflow run.
# Manual only. A maintainer runs it from main after bumping the version in
# sdk/typescript/package.json; leave "publish" unchecked for a dry run.
# Release steps: CONTRIBUTING.md, "Releasing the TypeScript SDK".
#
# Two jobs on purpose. "build" installs dependencies and runs third-party code
# with no publishing rights. "publish" holds the npm credentials (OIDC and the
# environment secret) and runs nothing but npm on the exact tarball "build"
# produced, verified by its sha256.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (unchecked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      spec: ${{ steps.pack.outputs.spec }}
    steps:
      - name: Require main for a real publish
        if: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publishing is only allowed from main (this run is on $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build and smoke-test the npm package
        run: bun run smoke:sdk

      - name: Refuse to republish an existing version
        working-directory: sdk/typescript/dist/package
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version 2>/dev/null | grep -qx "$version"; then
            echo "$name@$version is already on npm. Bump sdk/typescript/package.json first."
            exit 1
          fi
          echo "Ready: $name@$version"

      - name: Pack the tarball to publish
        id: pack
        working-directory: sdk/typescript/dist/package
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-tarball"
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP/sdk-tarball" | tail -n 1)
          sha256=$(sha256sum "$RUNNER_TEMP/sdk-tarball/$tarball" | cut -d' ' -f1)
          spec="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          {
            echo "tarball=$tarball"
            echo "sha256=$sha256"
            echo "spec=$spec"
          } >> "$GITHUB_OUTPUT"
          echo "$spec: $tarball sha256 $sha256"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - name: Require main for a real publish
        if: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publishing is only allowed from main (this run is on $GITHUB_REF)."
            exit 1
          fi

      # Node 24 bundles npm 11, which supports npm trusted publishing (OIDC).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("npm 11.5.1 or later is required"); process.exit(1); }' "$(npm --version)"

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball

      - name: Verify the tarball is the one that was built and tested
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
          SPEC: ${{ needs.build.outputs.spec }}
        run: |
          actual=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "sha256 mismatch: built $EXPECTED, downloaded $actual"
            exit 1
          fi
          echo "$SPEC sha256 $actual"

      - name: Dry run
        if: ${{ !inputs.publish }}
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.build.outputs.tarball }}
        run: npm publish --dry-run "$TARBALL"

      # Authenticates with npm trusted publishing when it is configured for
      # this workflow on npmjs.com; otherwise with the NPM_TOKEN secret of the
      # npm-publish environment.
      - name: Publish to npm
        if: ${{ inputs.publish }}
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.build.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$TARBALL"
