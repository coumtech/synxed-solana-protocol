name: Publish SDK

# Publishes sdk/typescript to npm as @coumtech/synxed-solana-protocol through
# npm trusted publishing (OIDC), with a provenance attestation that links the
# package to this workflow run. No npm token is stored in GitHub.
# Manual only. Leave "publish" unchecked for a dry run.
# Release steps and the one-time setup: CONTRIBUTING.md, "Releasing the
# TypeScript SDK".
#
# Three jobs, so the published file never meets unreviewed code:
# - package: installs from the lockfile with lifecycle scripts disabled,
#   compiles, packs, records the sha256, and uploads the tarball. Nothing from
#   the registry runs here except the pinned compiler.
# - verify: runs the tests and the smoke test against that exact tarball. The
#   smoke test installs from the registry, so this job may run third-party
#   code, but it cannot change the uploaded tarball or its recorded sha256.
# - publish: holds the npm-publish environment and id-token: write, runs only
#   npm, checks the sha256 and the manifest inside the tarball, and publishes.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (unchecked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@coumtech/synxed-solana-protocol"

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Require main for a real publish
        if: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publishing is only allowed from main (this run is on $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install JS dependencies from the lockfile, without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the package
        run: bun run build:sdk

      - name: Refuse a version that is already on npm
        working-directory: sdk/typescript/dist/package
        run: |
          version=$(node -p 'require("./package.json").version')
          if out=$(npm view "$PACKAGE_NAME@$version" version --json 2>/dev/null); then
            echo "$PACKAGE_NAME@$version is already on npm ($out). Bump sdk/typescript/package.json first."
            exit 1
          fi
          code=$(printf '%s' "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).error.code)}catch{console.log("unknown")}})')
          if [ "$code" != "E404" ]; then
            echo "Could not confirm that $PACKAGE_NAME@$version is unpublished (npm view: $code)."
            exit 1
          fi
          echo "$PACKAGE_NAME@$version is not on npm yet."

      - name: Pack the tarball
        id: pack
        working-directory: sdk/typescript/dist/package
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-tarball"
          npm pack --json --pack-destination "$RUNNER_TEMP/sdk-tarball" > "$RUNNER_TEMP/pack.json"
          tarball=$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")
          version=$(node -p 'require("./package.json").version')
          sha256=$(sha256sum "$RUNNER_TEMP/sdk-tarball/$tarball" | cut -d' ' -f1)
          {
            echo "tarball=$tarball"
            echo "sha256=$sha256"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "$PACKAGE_NAME@$version: $tarball sha256 $sha256" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dry run
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ steps.pack.outputs.tarball }}
        run: npm publish --dry-run --provenance=false "$TARBALL"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install JS dependencies from the lockfile, without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball

      - name: Check the sha256
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
          EXPECTED: ${{ needs.package.outputs.sha256 }}
        run: |
          actual=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "sha256 mismatch: packed $EXPECTED, downloaded $actual"
            exit 1
          fi

      - name: Smoke-test the exact tarball
        env:
          SYNXED_SDK_TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
        run: bun run smoke:sdk

  publish:
    name: publish
    needs: [package, verify]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publishing is only allowed from main (this run is on $GITHUB_REF)."
            exit 1
          fi

      # Node 24 bundles npm 11, which supports npm trusted publishing (OIDC).
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error("npm 11.5.1 or later is required"); process.exit(1); }' "$(npm --version)"

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball

      - name: Check the sha256 and the manifest inside the tarball
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
          EXPECTED: ${{ needs.package.outputs.sha256 }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          actual=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "sha256 mismatch: packed $EXPECTED, downloaded $actual"
            exit 1
          fi
          tar -xzOf "$TARBALL" package/package.json > "$RUNNER_TEMP/manifest.json"
          node -e '
            const m = require(process.argv[1]);
            const problems = [];
            if (m.name !== process.env.PACKAGE_NAME) problems.push("name is " + m.name);
            if (m.version !== process.env.VERSION) problems.push("version is " + m.version);
            if (m.scripts !== undefined) problems.push("manifest has scripts");
            if (m.private !== undefined) problems.push("manifest has private");
            if (JSON.stringify(m.publishConfig) !== JSON.stringify({ access: "public", provenance: true })) problems.push("unexpected publishConfig");
            if (problems.length > 0) { console.error(problems.join("; ")); process.exit(1); }
            console.log(m.name + "@" + m.version + " checked");
          ' "$RUNNER_TEMP/manifest.json"

      # Needs npm trusted publishing configured for this repository, this
      # workflow file, and the npm-publish environment. There is no token
      # fallback: without it, npm fails with ENEEDAUTH.
      - name: Publish to npm
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
        run: npm publish --provenance --access public "$TARBALL"
