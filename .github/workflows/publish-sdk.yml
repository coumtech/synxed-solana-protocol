name: Publish SDK

# Stages sdk/typescript on npm as @coumtech/synxed-solana-protocol through npm
# trusted publishing (OIDC), with a provenance attestation that links the
# package to this workflow run. No npm token is stored in GitHub. A staged
# version stays private until a maintainer approves it on npmjs.com with 2FA,
# so, with the trusted publisher limited to staging as CONTRIBUTING.md
# requires, a workflow run alone cannot make a version public.
# Manual only. Leave "publish" unchecked for a dry run.
# Release steps and the one-time setup: CONTRIBUTING.md, "Releasing the
# TypeScript SDK".
#
# Three jobs, so the staged file never meets unreviewed code:
# - package: installs from the lockfile with lifecycle scripts disabled,
#   compiles, packs, records the sha256, and uploads the tarball. Nothing from
#   the registry runs here except the pinned compiler.
# - verify: runs the tests and the smoke test against that exact tarball. The
#   smoke test installs from the registry, so this job may run third-party
#   code, but it cannot change the uploaded tarball or its recorded sha256.
# - publish: holds the npm-publish environment and id-token: write, checks out
#   no code and installs no dependencies, checks the sha256, every file name,
#   and the whole manifest inside the tarball, read both by GNU tar and by the
#   tar library npm itself uses, and stages it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Stage on npm (unchecked = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@coumtech/synxed-solana-protocol"
  # Pinned so every job runs the same npm: Node 24.22.0 bundles npm 11.19.1,
  # which supports npm stage (11.15.0 or later) and trusted publishing.
  NODE_VERSION: "24.22.0"

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Require main for a real release
        if: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases are only allowed from main (this run is on $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install JS dependencies from the lockfile, without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the package
        run: bun run build:sdk

      - name: Refuse a version that is already on npm
        working-directory: sdk/typescript/dist/package
        run: |
          version=$(node -p 'require("./package.json").version')
          if out=$(npm view "$PACKAGE_NAME@$version" version --json 2>/dev/null); then
            echo "$PACKAGE_NAME@$version is already on npm ($out). Bump sdk/typescript/package.json first."
            exit 1
          fi
          code=$(printf '%s' "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).error.code)}catch{console.log("unknown")}})')
          if [ "$code" != "E404" ]; then
            echo "Could not confirm that $PACKAGE_NAME@$version is unpublished (npm view: $code)."
            exit 1
          fi
          echo "$PACKAGE_NAME@$version is not on npm yet."

      - name: Pack the tarball
        id: pack
        working-directory: sdk/typescript/dist/package
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-tarball"
          npm pack --json --pack-destination "$RUNNER_TEMP/sdk-tarball" > "$RUNNER_TEMP/pack.json"
          tarball=$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")
          version=$(node -p 'require("./package.json").version')
          sha256=$(sha256sum "$RUNNER_TEMP/sdk-tarball/$tarball" | cut -d' ' -f1)
          {
            echo "tarball=$tarball"
            echo "sha256=$sha256"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "$PACKAGE_NAME@$version: $tarball sha256 $sha256" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dry run
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ steps.pack.outputs.tarball }}
        run: npm stage publish --dry-run --provenance=false "$TARBALL"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  verify:
    name: verify
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install JS dependencies from the lockfile, without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball

      - name: Check the sha256
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
          EXPECTED: ${{ needs.package.outputs.sha256 }}
        run: |
          actual=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "sha256 mismatch: packed $EXPECTED, downloaded $actual"
            exit 1
          fi

      - name: Smoke-test the exact tarball
        env:
          SYNXED_SDK_TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
        run: bun run smoke:sdk

  publish:
    name: publish
    needs: [package, verify]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases are only allowed from main (this run is on $GITHUB_REF)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Check npm supports staged trusted publishing
        run: |
          npm --version
          node -e 'const [a, b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 15)) { console.error("npm 11.15.0 or later is required for npm stage"); process.exit(1); }' "$(npm --version)"

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk-tarball

      # Independent of the repository code on purpose: the same rules as
      # scripts/build-sdk-package.ts, restated here (tests/sdk-package.test.ts
      # keeps the two in step).
      - name: Check the sha256, the file names, and the manifest
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
          EXPECTED: ${{ needs.package.outputs.sha256 }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          actual=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "sha256 mismatch: packed $EXPECTED, downloaded $actual"
            exit 1
          fi
          # --ignore-zeros reads past a lone zero block, as npm's own tar reader
          # does, so entries hidden behind one are seen (and refused) here too.
          # The check script then reads the tarball again with npm's own tar
          # library, which must see exactly the same entries and manifest.
          tar --ignore-zeros -tzf "$TARBALL" > "$RUNNER_TEMP/entries.txt"
          tar --ignore-zeros -tvzf "$TARBALL" | cut -c1 > "$RUNNER_TEMP/types.txt"
          cat > "$RUNNER_TEMP/check.cjs" <<'CHECK'
          const fs = require("node:fs");
          const [entriesFile, typesFile, tarball, npmTarPath] = process.argv.slice(2);
          const problems = [];
          const allowedFile = /^(?:[a-z][a-z0-9-]*\.(?:js|js\.map|d\.ts)|package\.json|README\.md|LICENSE)$/;
          const registryRange = /^[\^~]?(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/;
          const expectedKeys = ["author","bugs","dependencies","description","engines","exports","files","homepage","keywords","license","main","name","peerDependencies","publishConfig","repository","sideEffects","type","types","version"];
          const lines = (file) => fs.readFileSync(file, "utf8").split("\n").filter((line) => line !== "");
          const entries = lines(entriesFile);
          const types = lines(typesFile);
          if (types.length !== entries.length || types.some((type) => type !== "-")) problems.push("tarball entries that are not regular files");
          if (new Set(entries).size !== entries.length) problems.push("duplicate tarball entries");
          for (const entry of entries) {
            if (!entry.startsWith("package/") || !allowedFile.test(entry.slice(8))) problems.push("unexpected tarball entry " + entry);
          }
          if (problems.length > 0) { console.error(problems.join("\n")); process.exit(1); }
          // npm stages and installs what its own tar library reads, and that can
          // differ from GNU tar on a malformed header: node-tar rejects a signed
          // checksum and reads the entry's data as further entries. Read the
          // tarball again with the library this npm bundles, strictly, so any
          // header it would warn about fails, and require the same entries.
          const npmTar = require(npmTarPath);
          const npmEntries = [];
          const npmManifest = [];
          try {
            npmTar.t({ file: tarball, sync: true, strict: true, onentry: (entry) => {
              npmEntries.push(entry.type + " " + entry.path);
              if (entry.path === "package/package.json") entry.on("data", (chunk) => npmManifest.push(chunk));
            } });
          } catch (error) { problems.push("npm's tar reader refuses the tarball: " + error.message); }
          if (problems.length === 0 && JSON.stringify(npmEntries) !== JSON.stringify(entries.map((entry) => "File " + entry))) problems.push("npm's tar reader sees different entries: " + npmEntries.join(", "));
          if (problems.length > 0) { console.error(problems.join("\n")); process.exit(1); }
          const manifestText = require("node:child_process").execFileSync("tar", ["--ignore-zeros", "-xzOf", tarball, "package/package.json"], { encoding: "utf8" });
          if (manifestText !== Buffer.concat(npmManifest).toString("utf8")) problems.push("npm's tar reader sees a different package.json");
          const m = JSON.parse(manifestText);
          if (JSON.stringify(Object.keys(m).sort()) !== JSON.stringify(expectedKeys)) problems.push("unexpected manifest keys " + Object.keys(m).sort().join(","));
          if (m.name !== process.env.PACKAGE_NAME) problems.push("name is " + m.name);
          if (m.version !== process.env.VERSION) problems.push("version is " + m.version);
          if (JSON.stringify(m.publishConfig) !== JSON.stringify({ access: "public", provenance: true })) problems.push("unexpected publishConfig");
          for (const field of ["dependencies", "peerDependencies"]) {
            for (const [dep, spec] of Object.entries(m[field] || {})) {
              if (typeof spec !== "string" || !registryRange.test(spec)) problems.push(field + "." + dep + " is " + spec);
            }
          }
          const targets = [m.main, m.types];
          for (const entry of Object.values(m.exports || {})) targets.push(...(typeof entry === "string" ? [entry] : Object.values(entry)));
          for (const target of targets) {
            if (typeof target !== "string" || !target.startsWith("./") || target.includes("..") || !entries.includes("package/" + target.slice(2))) problems.push("bad target " + target);
          }
          if (problems.length > 0) { console.error(problems.join("\n")); process.exit(1); }
          console.log(m.name + "@" + m.version + ": " + entries.length + " files checked");
          CHECK
          node "$RUNNER_TEMP/check.cjs" "$RUNNER_TEMP/entries.txt" "$RUNNER_TEMP/types.txt" "$TARBALL" "$(npm root -g)/npm/node_modules/tar"

      # Needs a trusted publisher on npmjs.com for this repository, this
      # workflow file, and the npm-publish environment, allowed to stage. There
      # is no token fallback: without it npm refuses with an authentication
      # error. The staged version is private until a maintainer approves it.
      - name: Stage on npm
        env:
          TARBALL: ${{ runner.temp }}/sdk-tarball/${{ needs.package.outputs.tarball }}
        run: npm stage publish --provenance --access public "$TARBALL"
