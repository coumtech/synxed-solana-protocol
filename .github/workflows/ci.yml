name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test split math
        run: bun test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust split math
        run: cargo test --manifest-path programs/synxed-settlement/Cargo.toml
