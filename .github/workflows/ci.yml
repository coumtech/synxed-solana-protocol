name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AGAVE_VERSION: v4.2.1
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Forbid explicit any
        run: |
          if grep -RnE '(:\s*any\b|as\s+any\b|<any[,>])' \
            sdk/typescript/src examples/gaming-payment-demo/src tests \
            --include='*.ts'; then
            echo 'Explicit `any` found — this repo is strict TypeScript with no `any`.'
            exit 1
          fi

      - name: Test split math
        run: bun test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path programs/synxed-settlement/Cargo.toml

      - name: Test Rust split math
        run: cargo test --manifest-path programs/synxed-settlement/Cargo.toml

      - name: Test Rust instruction codec
        run: cargo test --manifest-path programs/synxed-settlement/Cargo.toml --features onchain

  program:
    name: program
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Agave toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/solana
          key: agave-${{ env.AGAVE_VERSION }}-${{ runner.os }}

      - name: Cache program build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: programs/synxed-settlement/target
          key: sbf-target-${{ env.AGAVE_VERSION }}-${{ hashFiles('programs/synxed-settlement/Cargo.lock') }}

      - name: Install Agave toolchain
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build on-chain program
        run: cargo build-sbf --manifest-path programs/synxed-settlement/Cargo.toml --features onchain

      - name: Report binary size and hash
        run: |
          ls -la programs/synxed-settlement/target/deploy/*.so
          sha256sum programs/synxed-settlement/target/deploy/synxed_settlement.so

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache SVM test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            programs/synxed-settlement/svm-tests/target
          key: svm-tests-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('programs/synxed-settlement/svm-tests/Cargo.lock') }}

      - name: Run program tests in an in-process SVM
        run: cargo test --manifest-path programs/synxed-settlement/svm-tests/Cargo.toml
