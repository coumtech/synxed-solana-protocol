name: Verify deployment

# Confirms the reference devnet program is byte-for-byte the build of `main`,
# using the pinned reproducible build container (see docs/verified-build.md).
# Runs after every push to main, daily, and on demand. A failure means either
# the deployment has not been upgraded to `main` yet, or it was built from
# something else.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_VERIFY_VERSION: "0.5.1"
  RUST_TOOLCHAIN: "1.98.0"
  PROGRAM_ID: HQtacJhd73ygr8rBg8mHpmHduhS79dFvDZqXCRhoU4HT
  RPC_URL: https://api.devnet.solana.com

jobs:
  verify:
    name: verify-deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache solana-verify binary
        id: cache-solana-verify
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}-${{ runner.os }}

      - name: Install solana-verify
        if: steps.cache-solana-verify.outputs.cache-hit != 'true'
        run: cargo install solana-verify --locked --version "$SOLANA_VERIFY_VERSION"

      - name: Build in the pinned container and compare with the on-chain program
        run: scripts/verify-deployment.sh "$PROGRAM_ID" "$RPC_URL"
