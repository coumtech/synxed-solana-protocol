version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Major bumps (new TypeScript majors, Node type majors, web3.js majors)
      # are taken deliberately, not via automated PRs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "cargo"
    directory: "/programs/synxed-settlement"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # solana-program majors track new Agave releases; bump them manually
      # together with a cargo build-sbf verification.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
